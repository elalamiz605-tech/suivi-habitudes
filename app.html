<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Momentum · Habits & tasks</title>
  <meta name="description" content="Momentum: track your habits, organise your tasks and see your progress.">
  <meta name="theme-color" content="#090a0c">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Momentum">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <script>
    // Thème appliqué avant le premier rendu pour éviter un flash.
    try {
      var th = localStorage.getItem('momentum:theme');
      if (!th) { var s = JSON.parse(localStorage.getItem('momentum:v2') || '{}'); var p = (s.settings && s.settings.theme) || 'dark'; th = p === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p; }
      document.documentElement.dataset.theme = th;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="preload" href="assets/fonts/HostGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="bg3d" aria-hidden="true"></canvas>
  <div class="bg-veil" aria-hidden="true"></div>

  <aside class="sidebar">
    <a class="brand" href="#/today" aria-label="Momentum, home">
      <img src="assets/favicon.svg" alt="" width="28" height="28">
      <span>Momentum</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
    <div class="level card" id="level"></div>
  </aside>

  <main id="view" class="view" tabindex="-1">
    <noscript><p>Momentum needs JavaScript to run.</p></noscript>
  </main>

  <dialog id="modal" class="modal" aria-label="Form"></dialog>
  <dialog id="palette" class="palette" aria-label="Command palette"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
