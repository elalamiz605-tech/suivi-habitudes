<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Momentum · animations du logo</title>
<style>
:root{--bg:#090a0c;--text:#eceef1;--text-2:#a4aab4;--signal:#ff5b3a;--line:#2b3037;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.tabs{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;padding:12px 16px;overflow-x:auto;z-index:2;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs button{flex:none;background:#0e1013;color:var(--text-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--text);border-color:var(--signal)}
.stage{min-height:100vh;display:grid;place-items:center;padding:90px 20px 40px;cursor:pointer}
.stage>div{display:grid;justify-items:center;gap:22px}
.card{width:min(340px,86vw);background:#0e1013;border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-align:center}
.card b{display:block;font-size:16px;margin-bottom:4px}.card p{margin:0;color:var(--text-2);font-size:13.5px}
.card .n{font:600 12px ui-monospace,monospace;color:var(--signal);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.hint{color:var(--text-2);font-size:12.5px}
.logo{display:flex;align-items:center;gap:18px;font-weight:700;font-size:40px;letter-spacing:-.03em}
.logo svg{width:84px;height:84px;overflow:visible}
.logo .w{position:relative}
.ring{stroke:#2a2e35}.arc{stroke:var(--signal)}
/* 1 Tracé */
.d1 .arc{stroke-dasharray:81;stroke-dashoffset:81;animation:draw 1.1s var(--ease) .3s forwards}
.d1 .ring{opacity:0;animation:fade .6s ease forwards}
.d1 .w{opacity:0;transform:translateX(-10px);animation:slide .6s var(--ease) 1.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}@keyframes slide{to{opacity:1;transform:none}}
/* 2 Élan */
.d2 svg{animation:spin 1s var(--ease) both}
.d2 .ring{opacity:0;animation:fade .5s ease .5s forwards}
.d2 .arc{transform-origin:32px 32px;animation:spin2 1s var(--ease) both}
.d2 .w{opacity:0;animation:fade .5s ease .9s forwards}
@keyframes spin{from{transform:scale(.6) rotate(-180deg);opacity:0}}@keyframes spin2{from{transform:rotate(-360deg)}}
/* 3 Impulsion */
.d3 svg{animation:pop .7s cubic-bezier(.3,1.6,.4,1) both}
.d3 .ripple{fill:none;stroke:var(--signal);stroke-width:2;opacity:0;animation:ripple 1s ease-out .55s both}
.d3 .w{opacity:0;transform:scale(.9);animation:slide .5s var(--ease) .7s forwards}
@keyframes pop{from{transform:scale(0)}}@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.2);opacity:0}}
.d3 .ripple{transform-origin:32px 32px}
/* 4 Assemblage */
.d4 .sq{opacity:0;animation:fade .6s ease .6s forwards}
.d4 .ring{transform:translateX(-50px);opacity:0;animation:join .7s var(--ease) both}
.d4 .arc{transform:translateX(50px);opacity:0;animation:join .7s var(--ease) .1s both}
.d4 .w{opacity:0;animation:fade .5s ease .9s forwards}
@keyframes join{to{transform:none;opacity:1}}
/* 5 Battement */
.d5 .arc{stroke-dasharray:81;stroke-dashoffset:81;animation:draw .9s var(--ease) .2s forwards,beat .5s ease 1.25s}
.d5 .ring{opacity:0;animation:fade .6s ease forwards}
.d5 svg{animation:beat .5s ease 1.25s}
.d5 .glow{fill:var(--signal);opacity:0;animation:glow .6s ease 1.25s}
.d5 .w span{display:inline-block;opacity:0;transform:translateY(10px);animation:slide .4s var(--ease) forwards;animation-delay:calc(1.3s + var(--i)*.05s)}
@keyframes beat{30%{transform:scale(1.12)}}@keyframes glow{40%{opacity:.35}}
/* 6 Orbite */
.d6 .arc{stroke-dasharray:81;stroke-dashoffset:81;animation:draw 1.2s linear .2s forwards}
.d6 .ring{opacity:0;animation:fade .5s ease forwards}
.d6 .dot{fill:var(--signal);offset-path:path("M32 15a17 17 0 1 1-16.2 22.2");offset-distance:0%;opacity:0;animation:orbit 1.2s linear .2s forwards}
.d6 .w{opacity:0;animation:fade .4s ease 1.4s forwards}
.d6 .w::after{content:'';display:inline-block;width:.18em;height:.18em;border-radius:50%;background:var(--signal);margin-left:.08em;transform:scale(0);animation:pop .4s cubic-bezier(.3,1.6,.4,1) 1.45s forwards}
@keyframes orbit{0%{opacity:1;offset-distance:0%}95%{opacity:1}100%{opacity:0;offset-distance:100%}}
</style></head><body>
<div class="tabs" id="tabs"></div>
<div class="stage" id="stage"><div><div class="logo" id="logo"></div>
<div class="card"><div class="n" id="num"></div><b id="title"></b><p id="desc"></p></div><div class="hint">Touchez pour rejouer</div></div></div>
<script>
const SVG=(extra='')=>`<svg viewBox="0 0 64 64"><rect class="sq" width="64" height="64" rx="14" fill="#0c0d10"/><circle class="ring" cx="32" cy="32" r="17" fill="none" stroke-width="5"/>${extra}<path class="arc" d="M32 15a17 17 0 1 1-16.2 22.2" fill="none" stroke-width="5" stroke-linecap="round"/></svg>`;
const demos=[
{name:'Tracé',desc:'L’arc orange se dessine comme un trait, puis le nom glisse à côté. Sobre et net.',html:SVG()+'<span class="w">Momentum</span>'},
{name:'Élan',desc:'Le logo arrive en tournant et se pose avec un léger freinage. Donne l’idée de mouvement.',html:SVG()+'<span class="w">Momentum</span>'},
{name:'Impulsion',desc:'Le logo surgit avec un rebond, une onde orange s’en échappe. Énergique.',html:SVG('<circle class="ripple" cx="32" cy="32" r="22"/>')+'<span class="w">Momentum</span>'},
{name:'Assemblage',desc:'L’anneau gris et l’arc orange viennent de chaque côté et s’emboîtent. Comme deux pièces qui se rejoignent.',html:SVG()+'<span class="w">Momentum</span>'},
{name:'Battement',desc:'L’arc se trace, puis un battement de cœur avec un halo, et les lettres apparaissent une à une.',html:SVG('<circle class="glow" cx="32" cy="32" r="26"/>')+'<span class="w">'+[...'Momentum'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')+'</span>'},
{name:'Orbite',desc:'Un point orange parcourt le cercle en laissant l’arc derrière lui, puis se pose en point final après le nom.',html:SVG('<circle class="dot" r="4"/>')+'<span class="w">Momentum</span>'},
];
let cur=0;const tabs=document.getElementById('tabs'),logo=document.getElementById('logo');
demos.forEach((d,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${d.name}`;b.onclick=(e)=>{e.stopPropagation();pick(i)};tabs.appendChild(b)});
function play(){logo.className='logo';void logo.offsetWidth;logo.innerHTML=demos[cur].html;logo.classList.add('d'+(cur+1))}
function pick(i){cur=i;[...tabs.children].forEach((b,j)=>b.classList.toggle('on',i==j));num.textContent=`Exemple ${i+1} / ${demos.length}`;title.textContent=demos[i].name;desc.textContent=demos[i].desc;location.hash=i+1;play()}
document.getElementById('stage').onclick=play;
const fromHash=()=>pick(Math.min(Math.max((+location.hash.slice(1)||1)-1,0),demos.length-1));
addEventListener('hashchange',()=>{if((+location.hash.slice(1)||1)-1!==cur)fromHash()});fromHash();
</script></body></html>
