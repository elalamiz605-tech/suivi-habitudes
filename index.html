<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivi d'habitudes</title>
  <meta name="description" content="Suivez vos habitudes au quotidien et gardez vos séries de jours réussis.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>Suivi d'habitudes</h1>
        <p class="today" id="today"></p>
      </div>
      <div class="summary" id="summary" aria-live="polite"></div>
    </header>

    <form class="add" id="add-form" autocomplete="off">
      <input id="emoji" class="emoji-input" maxlength="2" value="💧" aria-label="Emoji">
      <input id="name" class="name-input" placeholder="Nouvelle habitude (ex. Boire 2 L d'eau)" maxlength="40" required aria-label="Nom de l'habitude">
      <button type="submit" class="btn-primary">Ajouter</button>
    </form>

    <section class="week-head" aria-hidden="true">
      <span></span>
      <div class="days" id="days-head"></div>
      <span></span>
    </section>

    <ul class="habits" id="habits"></ul>

    <p class="empty" id="empty" hidden>
      Aucune habitude pour l'instant.<br>Ajoutez-en une ci-dessus pour commencer 🚀
    </p>

    <footer class="foot">
      Vos données restent dans votre navigateur (aucun compte, aucun serveur).
      <button type="button" class="link" id="export">Exporter</button>
      ·
      <label class="link">Importer<input type="file" id="import" accept="application/json" hidden></label>
    </footer>
  </main>

  <template id="habit-tpl">
    <li class="habit">
      <div class="info">
        <span class="h-emoji"></span>
        <div>
          <div class="h-name"></div>
          <div class="h-streak"></div>
        </div>
      </div>
      <div class="days"></div>
      <button type="button" class="delete" aria-label="Supprimer">✕</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
